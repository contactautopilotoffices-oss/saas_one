honest_summary: >
  The council is a well-engineered instrument that has never been switched on. The migration
  has never been applied, so zero council tables exist: no identity, session, finding or
  inbox row has ever been persisted. What I could verify by running it is genuinely good —
  the 10-section data pack pulls real live figures (529 of 749 PPMs overdue, 306 unresolved
  mailbox threads), the 3-stage protocol executes correctly with real anonymized peer
  ranking, and a live persona call produced four evidence-cited findings whose numbers I
  confirmed against the database exactly. That is a real foundation and FP-01 holds.
  But the scores are low because the requirements are about outcomes, not instruments.
  Three of twelve score zero. Nothing is scheduled, so nothing initiates (REQ-04=0). WhatsApp
  exists only as fake content in a UI fixture (REQ-08=0). And on the requirement the whole
  project answers to — reducing dependence on the team — there is not one task a person has
  stopped doing (REQ-12=0). The prompt's own canonical example, "water not logged today", is
  not implemented: the string "water" appears zero times in the data pack. Six of ten TRUTH
  checks fail because the audit's known facts were never fed to the agents as evidence, so
  the personas cannot flag what they cannot see. Nothing in this session reduced the human's
  supervision load; strictly, the build has added a system that must itself be supervised.
  The single highest-leverage next action is not more code: it is applying the migration and
  running one real council session, which would convert roughly half these scores from
  "written" to "working".
