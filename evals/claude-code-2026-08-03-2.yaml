hard_ceiling:
  finding: >
    None of the five new migrations are applied to the production database. All nine tables
    the new code depends on return NULL from to_regclass: pending_actions,
    electricity_disputes, electricity_dispute_responses, electricity_chase_tasks,
    employee_reliability_events, employee_reliability_scores, electricity_bill_validations,
    electricity_payment_runs, electricity_bill_documents.
  consequence: >
    EVAL.md's anchors put 3 at "works against the real database on real records" and 2 at
    "runs on a happy path with hand-fed input; breaks or silently no-ops on real FMS data."
    Not one requirement in this set can currently run at all — not even on hand-fed input,
    because the tables to feed do not exist. Every score below is therefore capped at 1-2 on
    deployment state alone, independent of code quality.
  fairness_note: >
    This is NOT a criticism of the building agents. The repo rule is that agents write
    migrations and the user applies them, and they followed it correctly — every new module
    also degrades through isMissingRelation rather than throwing, which is the right
    pattern. The ceiling is a fact about what can be demonstrated today, not about who is at
    fault. It lifts the moment the user applies the migrations, and several scores would
    move 1 -> 3 that same hour.
  repro: |
    select to_regclass('public.pending_actions'), to_regclass('public.electricity_disputes'),
           to_regclass('public.electricity_chase_tasks'), to_regclass('public.electricity_payment_runs');
    -- all null

