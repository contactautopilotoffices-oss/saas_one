scores:
  - id: REQ-E-01
    weight: 8
    score: 4
    was: 1
    prompt_line: '"we will be converting them to sending emails to a single email ID"'
    verdict: >
      Allow-list fails CLOSED — an org with no entries quarantines everything rather than
      accepting everything, so the control cannot silently do nothing until configured.
      Quarantined mail is stored but never parsed (no Groq spend on a stranger's attachment)
      and never forwarded (nothing relayed to a site under our name). Release is a named
      human act. Dedup unchanged and sound.
    remaining: "No standalone allow-list management screen; senders are trusted via release."

  - id: REQ-E-02
    weight: 10
    score: 4
    was: 1
    prompt_line: '"we would us e the existing groq ocr here as well"'
    verdict: >
      Rebuilt to the shape the spec demands. The model now returns a confidence PER FIELD
      with an explicit instruction not to give every field the same score, null fields are
      forced to 0 regardless of what the model claims, and the document roll-up is the
      MINIMUM across critical fields rather than an average — an average is exactly how one
      unreadable due date hides behind ten crisp ones. A weak critical field parks the bill
      at needs_manual_entry and blocks the SPOC forward. The Inbox names the weakest field
      and shows the full breakdown on hover, which is the grounding question answered
      literally: you can see which field is weakest without opening the PDF.
    remaining: >
      Unverified against a real bill PDF — none exists in the system. Whether the model
      genuinely varies its per-field scores is an empirical question I could not test.

  - id: REQ-E-03
    weight: 4
    score: 4
    was: 1
    prompt_line: '"we will also send a copy of these electricity bills to the site propetry admins"'
    verdict: >
      forwardBill resolves the SPOC via spoc_user_id then property_admin membership,
      EmailService carries attachments, forwarded_to/forwarded_at are recorded. Now correctly
      suppressed when a critical field is low-confidence.

  - id: REQ-E-04
    weight: 10
