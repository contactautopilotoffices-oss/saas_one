  # ---- New requirements from the 03-Aug walkthrough -----------------------
  - id: NEW-CYCLE
    weight: 10
    score: 4
    prompt_line: >
      "this entire cycle from when the electricity bill is recieved to when the bill is paid
      the early due timeline is the one to track so everything here is a run against time and
      it has to be visible here as well"
    verdict: >
      The design decision that makes this useful: the deadline that matters is the
      EARLY-PAYMENT date, not the due date, because that is the one with money attached. A
      bill delivered comfortably before its due date can still have lost every rupee of
      discount, and nothing previously showed that. days_in_stage is the number the module
      exists for — a bill eight days in 'validating' with six days left has already lost the
      race, and that is knowable now instead of at month-end reconciliation. Stalled bills
      carry a plain-English sentence generated server-side, so the UI, the PDF and any future
      alert cannot describe the same problem differently. Now the tab's default view.
    remaining: "cycle_days is null for the 102 imported bills — no honest arrival time exists, and the UI says so rather than substituting the bill date."

  - id: NEW-TARGET
    weight: 8
    score: 4
    prompt_line: >
      "the electricity council memember be provided a a taget that he has to ensure this much
      amount lets say 15 lacs to be saved anually from electricity bills alone and hehas to
      run with it"
    verdict: >
      Target is owned by a named person — "he has to run with it" means the number needs a
      face against it. Attainment is computed from the SAME captured/missed maths the
      Discount Performance view uses, so the target can never drift from what the tracker
      reports. Bills belong to a period by billing month, not payment date, so a target
      cannot be gamed by timing a payment across a year boundary. Pace is linear and says so.
      Unverifiable discount (paid, no payment date — 7 of 102 rows in the source workbook) is
      shown next to the number rather than hidden, because someone chasing 15 lakhs deserves
      to know some of it may already be won and simply not evidenced. Only super admins can
      set it (403 server-side); the people measured by it cannot move it.

