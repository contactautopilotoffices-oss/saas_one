honest_summary: >
  Eleven of fifteen requirements are now at 4 under the local rubric, up from a set that was
  entirely 0s and 1s this morning. Four are not, and none of the four is a deployment
  problem. REQ-E-11 has no screen for the audit trail, which is mine and fixable in an hour.
  REQ-E-10 still carries an affordance nobody asked for. REQ-E-03's forwarding has never been
  observed delivering. And REQ-E-04 is stuck at 3 for a reason no amount of code moves: you
  cannot set a variance threshold from data that does not exist, and meter coverage during
  billed months peaks at 26%. That last one is also the answer to why the score is 3.8 and
  not 4.0 — the arithmetic to 4.0 requires REQ-E-04 to reach 4, and it cannot until readings
  are actually being logged during a month you also hold bills for. Which returns to the
  finding from the first evaluation this morning: the chase is not a supporting feature of
  this spec, it is the product, and the reconciliation becomes possible a few months after
  the chase starts working.
