bugs_caught_before_shipping:
  - >
    employee_reliability_scores: my replacement view declared (organization_id, user_id, …)
    but 20260804000004 declared (user_id, organization_id, …). CREATE OR REPLACE VIEW forbids
    reordering columns, so the migration would have failed on apply with "cannot change name
    of view column". Fixed by DROP-then-CREATE, which also makes the migration re-runnable.
