honest_summary: >
  Of the thirteen electricity requirements, nine are at 0 and four are at 1. Nothing in this
  pipeline is built. The four ones are all the same shape: a real, working asset exists
  adjacent to the requirement — Groq OCR for meters, a reconciliation on the wrong axis, a
  'disputed' enum value, an unread-count bell — and each will mislead a reader into thinking
  the requirement is partly done. It is not. The most useful output of this session is not a
  score, it is the premise test: the pipeline's founding assumption is that meter logs are
  filled to the pinpoint, and across every month for which a bill exists, meter coverage
  peaks at 26% and is 0% for the two earliest months. Nobody could have built S4 on this data
  regardless of how well it was engineered. The chase is not a supporting feature of this
  spec; on the evidence it is the whole product, and the reconciliation is what becomes
  possible a few months after the chase starts working.
