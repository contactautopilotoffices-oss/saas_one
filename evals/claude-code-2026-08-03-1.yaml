# ---------------------------------------------------------------------------
# HEADLINE FINDING — the premise test from SPEC-ELECTRICITY.md §5
# ---------------------------------------------------------------------------
premise_test:
  question: >
    The spec's §5 says: build S4 read-only first, because the whole pipeline rests on
    "if data is filled to the pinpoint, validating the data against the bill should not be
    a problem." How often is the data actually filled to the pinpoint?
  method: >
    Read-only SQL against the production Supabase project (xvucakstcmtfoanmgcql), joining
    electricity_bills.billing_month against distinct meter coverage in electricity_readings.
  result: >
    There is NO month in the database where bills and meter readings are both adequately
    populated. Bill data runs 2025-11 .. 2026-05. Meter coverage in those exact months:
    Nov-2025 0/46 meters, Dec-2025 0/46, Jan-2026 7/46, Feb-2026 12/46, Mar-2026 8/46,
    Apr-2026 9/46, May-2026 9/46. Peak coverage during any billed month is 26% (Feb-2026).
    Coverage does improve to 76-78% in Jun/Jul-2026 — but there are zero bills for those
    months. The overlap between "months with bills" and "months with usable logs" is empty.
  implication: >
    S4 cannot be run today on any month, and no variance threshold (decision #1, the
    spec's own top-ranked blocker) can be derived from this data. The spec author's
    hypothesis is confirmed and stronger than stated: "If it turns out the logs are 40%
    complete, S5 is the product and the rest is packaging." The logs are ~20% complete
    across the billed period. S5 is the product.
  repro: |
    with bill_months as (select distinct billing_month::date m from electricity_bills),
         read_cov as (select date_trunc('month',reading_date)::date m,
                             count(distinct meter_id) meters_reporting
                      from electricity_readings group by 1)
    select b.m bill_month, coalesce(r.meters_reporting,0) meters_reporting,
           (select count(*) from electricity_meters) meters_total
    from bill_months b left join read_cov r on r.m=b.m order by b.m;

data_quality_defects_found:
  - id: DQ-01
    finding: >
      24 electricity_readings rows are dated in the future, from 2026-08-04 to 2026-12-07
      (today is 2026-08-03). A meter reading cannot be taken tomorrow. No CHECK constraint
      or application guard rejects a future reading_date.
    impact: >
      Any completeness scan for S5 will treat these as filled, suppressing chase tasks for
      dates that were never actually read. Fix before S5 is built or the chase engine
      inherits the defect.
    repro: "select count(*) from electricity_readings where reading_date > current_date;"
  - id: DQ-02
    finding: >
      electricity_billing_accounts.aop_site_id is NULL on all 15 rows. The FK exists; the
      data does not.
    impact: "S13 (AOP linkage) has no join key populated. The last stage of the pipeline is unreachable even once built."
    repro: "select count(*) from electricity_billing_accounts where aop_site_id is not null;"
  - id: DQ-03
    finding: >
      4 of 15 billing accounts have property_id NULL, and meters exist on only 6 distinct
      properties. Bill-to-meter joins are partial before any code is written.
    repro: "select count(*) filter (where property_id is not null), count(*) from electricity_billing_accounts;"
  - id: DQ-04
    finding: >
      The view electricity_monthly_consumption (created in 20260802000003) is read by zero
      lines of application code. Grep for it across app/, backend/, frontend/ returns nothing.
    impact: "Dark data in the exact place S4 needs to read from. Relevant to EVAL.md REQ-05."

